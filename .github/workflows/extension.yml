name: Build synclEE
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
      - name: Set the distribution OAuth client ID
        if: vars.SYNCLEE_GITHUB_CLIENT_ID != ''
        env:
          SYNCLEE_GITHUB_CLIENT_ID: ${{ vars.SYNCLEE_GITHUB_CLIENT_ID }}
        run: |
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            const id = process.env.SYNCLEE_GITHUB_CLIENT_ID;
            if (!/^[a-z0-9]+$/i.test(id)) throw new Error("Invalid OAuth client ID");
            writeFileSync("extension/oauth-config.js", "export const defaultClientId = " + JSON.stringify(id) + ";\n");
          '
      - name: Package the extension
        working-directory: extension
        run: zip -r ../site/synclEE.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: synclEE
          path: site/synclEE.zip
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: synclEE
      - run: gh release create "$GITHUB_REF_NAME" synclEE.zip --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

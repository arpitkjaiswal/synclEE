name: Build synclEE
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
      - name: Set the distribution OAuth client ID
        if: vars.SYNCLEE_GITHUB_CLIENT_ID != ''
        env:
          SYNCLEE_GITHUB_CLIENT_ID: ${{ vars.SYNCLEE_GITHUB_CLIENT_ID }}
        run: |
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            const id = process.env.SYNCLEE_GITHUB_CLIENT_ID;
            if (!/^[a-z0-9]+$/i.test(id)) throw new Error("Invalid OAuth client ID");
            writeFileSync("extension/oauth-config.js", "export const defaultClientId = " + JSON.stringify(id) + ";\n");
          '
      - name: Package the extension
        working-directory: extension
        run: zip -r ../site/synclEE.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: synclEE
          path: site/synclEE.zip
  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: synclee-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: synclEE
          path: published
      - name: Publish the tested package on the Pages source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp site/index.html published/index.html
          cd published
          git add index.html synclEE.zip
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish synclEE from $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
      - name: Verify the public page and ZIP against the build
        run: |
          site=https://arpitkjaiswal.github.io/synclEE
          for attempt in {1..30}; do
            if curl -fsSL "$site/?build=$GITHUB_SHA" -o live.html &&
               cmp -s live.html site/index.html &&
               curl -fsSL "$site/synclEE.zip?build=$GITHUB_SHA" -o live.zip &&
               cmp -s live.zip published/synclEE.zip; then
              unzip -tq live.zip
              exit 0
            fi
            sleep 10
          done
          exit 1
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: synclEE
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" synclEE.zip --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
